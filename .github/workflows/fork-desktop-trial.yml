name: Fork desktop trial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Check VM and isolated GUI login capabilities
        run: |
          set -euo pipefail
          [[ $RUNNER_ENVIRONMENT == github-hosted && $(uname -sm) == 'Darwin arm64' ]]
          probe=$(mktemp -d /private/tmp/paseo-capabilities.XXXXXXXX)
          trap 'rm -rf "$probe"' EXIT
          chmod 755 "$probe"
          cat > "$probe/session.swift" <<'SWIFT'
          import CoreGraphics
          import Darwin
          import Virtualization

          print("macOS guest virtualization supported:", VZVirtualMachine.isSupported)
          let id = getuid()
          let session = CGSessionCopyCurrentDictionary() as? [String: Any]
          let owner = session?[kCGSessionUserIDKey as String] as? NSNumber
          let login = session?[kCGSessionLoginDoneKey as String] as? Bool ?? false
          print("process UID:", id, "WindowServer session UID:", owner?.stringValue ?? "none", "GUI login:", login)
          if CommandLine.arguments.contains("--test-account") && (owner?.uint32Value != id || !login) {
              exit(1)
          }
          SWIFT
          xcrun swiftc "$probe/session.swift" -o "$probe/session"
          "$probe/session"
          account=paseoprobe
          if id "$account" >/dev/null 2>&1; then exit 1; fi
          sudo -n /usr/sbin/sysadminctl -addUser "$account" -fullName 'Paseo CI capability probe' -password "$(openssl rand -hex 32)"
          probe_uid=$(id -u "$account")
          if sudo -n launchctl print "gui/$probe_uid" >/dev/null 2>&1; then
            echo 'The new account has a GUI login domain.'
          else
            echo 'The new account has no GUI login domain.'
          fi
          sudo -n -u "$account" /usr/bin/env -i PATH=/usr/bin:/bin "$probe/session" --test-account
