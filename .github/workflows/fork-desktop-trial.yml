name: Fork desktop trial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build macOS ARM64 in Linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 64
      - name: Build candidate
        run: bash scripts/fork-ci/build.sh "$RUNNER_TEMP/candidate"
      - name: Verify archive and record digest
        id: digest
        working-directory: ${{ runner.temp }}/candidate
        run: |
          sha256sum -c SHA256SUMS
          echo "sha256=$(sha256sum Paseo-mac-arm64.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
    needs: security
  smoke:
    name: Desktop runtime test (blocked by isolation)
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Report unavailable macOS isolation
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          {
            echo '### Desktop runtime test blocked'
            echo
            echo 'The standard macos-26 runner could not start a nested macOS VM. A separate user shared the runner’s graphical session.'
            echo 'The packaged app was not launched. Its window, project, chat and terminal remain unverified.'
            echo
            printf 'Build artifact: `desktop-arm64-%s` · archive SHA-256: `%s`\n' "$GITHUB_SHA" "$ARCHIVE_SHA256"
            echo
            echo '[Hosted macOS isolation probe](https://github.com/pajikos/paseo/actions/runs/44614226027/job/135878502375)'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=Desktop runtime test blocked::The required offline macOS GUI environment is unavailable on standard GitHub-hosted runners.'
          exit 1
  security:
    name: Scan npm dependencies
    if: github.repository == 'pajikos/paseo' && (github.ref == 'refs/heads/fork/stable' || startsWith(github.ref, 'refs/heads/update/'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Scan pinned npm versions
        run: |-
          python3 -I scripts/fork-ci/security-test.py
          bash scripts/fork-ci/security.sh "$RUNNER_TEMP/npm-security"
      - name: Include scan summary
        if: '${{ !cancelled() }}'
        run: |-
          if test -f "$RUNNER_TEMP/npm-security/security-summary.txt"; then
            sed 's/^/    /' "$RUNNER_TEMP/npm-security/security-summary.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload security reports
        if: '${{ !cancelled() }}'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-security-${{ github.sha }}
          path: ${{ runner.temp }}/npm-security/
          retention-days: 7
          if-no-files-found: error
